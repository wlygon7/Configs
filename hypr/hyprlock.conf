# Generated by matugen from ~/.config/matugen/templates/hyprlock.conf. Edit the template, not this file.
# Lock screen. Based on /usr/share/hypr/hyprlock.conf, restyled to match the bar's glass look.

$font = Noto Sans

general {
    hide_cursor = true
    ignore_empty_input = false
}

animations {
    enabled = true
    bezier = glide, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 5, glide
    animation = fadeOut, 1, 5, glide
    animation = inputFieldDots, 1, 2, glide
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 1
    inner_color = rgba(111318aa)
    outer_color = rgba(e1e2e926)
    check_color = rgba(a6c8ffcc)
    fail_color = rgba(ffb4abcc)
    font_color = rgba(e1e2e9ff)
    fade_on_empty = false
    rounding = 26

    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL

    dots_spacing = 0.3

    position = 0, -140
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgba(e1e2e9ff)
    font_size = 96
    font_family = $font Bold

    position = 0, 160
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(c3c6cfff)
    font_size = 20
    font_family = $font

    position = 0, 60
    halign = center
    valign = center
}
