# Idle handling. Based on /usr/share/hypr/hypridle.conf (desktop: no backlight, no auto-suspend).
# Media players and the bar's keep-awake button inhibit this while active.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# No idle actions: no auto-lock and no screens off. Lock manually with Super+L or the power menu.
