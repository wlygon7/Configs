# Generated by matugen from ~/.config/matugen/templates/starship.toml. Edit the template, not this file.
# Two lines: where you are (directory, git, toolchain, slow-command time), then the prompt arrow.

"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
palette = "matugen"

format = """
$directory$git_branch$git_state$git_status$python$nodejs$rust$golang$java$cmd_duration$jobs
$character"""

[palettes.matugen]
primary = "{{colors.primary.default.hex}}"
tertiary = "{{colors.tertiary.default.hex}}"
muted = "{{colors.on_surface_variant.default.hex}}"
outline = "{{colors.outline.default.hex}}"
red = "{{colors.red.default.hex}}"
green = "{{colors.green.default.hex}}"
yellow = "{{colors.yellow.default.hex}}"

[directory]
style = "bold primary"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
symbol = " "
style = "tertiary"
format = "[$symbol$branch]($style) "

[git_state]
style = "yellow"

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"

[python]
style = "muted"
format = '[$symbol$version( \($virtualenv\))]($style) '

[nodejs]
style = "muted"
format = "[$symbol$version]($style) "

[rust]
style = "muted"
format = "[$symbol$version]($style) "

[golang]
style = "muted"
format = "[$symbol$version]($style) "

[java]
style = "muted"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "outline"
format = "[took $duration]($style) "

[jobs]
style = "outline"

[character]
success_symbol = "[❯](bold primary)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
